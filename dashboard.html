<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banco Escolar - Mi cuenta</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/x-icon" href="assets/favicon.png">
</head>
<body class="pagina-dashboard">
<header class="barra-superior">
  <a href="dashboard.html" class="barra-logo-link">

      <img src="assets/logo.png" alt="Kajuyalí Bank">
      <span>Kajuyalí Bank</span>
    </div>
  </a>
  <button id="btnCerrarSesion" class="btn-naranja">Cerrar sesión</button>
</header>

  <main class="contenedor-dashboard">
    <section class="tarjeta-saldo">
      <p class="etiqueta">Hola, <span id="nombreCliente">...</span></p>
      <p class="etiqueta">Saldo disponible</p>
      <p class="monto" id="saldoActual">$0</p>
      <p id="avisoEstado" class="aviso-estado"></p>
    </section>

    <section class="grid-acciones">
      <a href="transferir.html" class="tarjeta-accion">
        <span class="icono">💸</span>
        <span>Enviar dinero</span>
      </a>
      <a href="pagar-servicio.html" class="tarjeta-accion">
        <span class="icono">🧾</span>
        <span>Pagar servicio</span>
      </a>
      <a href="pagar-credito.html" class="tarjeta-accion">
      <span class="icono">💰</span>
      <span>Mi crédito</span>
      </a>

      <a href="historial.html" class="tarjeta-accion">
        <span class="icono">📋</span>
        <span>Movimientos</span>
      </a>

    </section>
  </main>

  <footer class="pie-pagina">
  Aplicación desarrollada por <a href="https://www.instagram.com/esuka.creativo/" target="_blank" rel="noopener">Esuká Creativos</a> para uso didáctico de Kajuyalí School

  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>

</html>
