<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banco Escolar - Iniciar sesión</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/x-icon" href="assets/favicon.png">
</head>
<body class="pagina-login">
  <div class="contenedor-login">
    <img src="assets/logo-2.png" alt="Kajuyalí Bank" class="logo-login">
    <h1>Kajuyalí Bank</h1>
    <form id="formLogin">
      <label for="usuario">Usuario</label>
      <input type="text" id="usuario" required autocomplete="off">

      <label for="password">Contraseña</label>
      <input type="password" id="password" required>

      <button type="submit">Ingresar</button>
    </form>
    <p id="mensajeError" class="error"></p>
      <footer class="pie-pagina">
  Aplicación desarrollada por <a href="https://www.instagram.com/esuka.creativo/" target="_blank" rel="noopener">Esuká Creativos</a> para uso didáctico de Kajuyalí School
</footer>
  </div>



  <script src="js/config.js"></script>
  <script src="js/login.js"></script>

</body>
</html>
